<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPro | Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; }
        .password-container { position: relative; }
        /* Positioning the eye icon inside the input box */
        .toggle-password { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            cursor: pointer; 
            color: #6b7280;
            user-select: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 md:p-10">
        <div class="text-center mb-10">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center font-black text-white mx-auto mb-4 italic text-xl shadow-lg shadow-blue-500/20">A</div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Admin Portal</h1>
            <p class="text-gray-500 text-sm mt-1">Access the Control Room</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-[10px] font-black uppercase text-gray-400 tracking-[0.2em] mb-2 ml-1">Email Address</label>
                <input type="email" id="email" required placeholder="ogirima@fundbridgeafrica.online"
                    class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-gray-700">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase text-gray-400 tracking-[0.2em] mb-2 ml-1">Password</label>
                <div class="password-container">
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition text-gray-700">
                    <span id="toggleIcon" class="toggle-password" onclick="togglePassword()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-blue-700 transition shadow-lg shadow-blue-500/30 active:scale-95">
                Enter Dashboard
            </button>
        </form>

        <p id="message" class="mt-6 text-center text-sm font-bold uppercase tracking-tight min-h-[1.25rem]"></p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        // Humanized Logic: Toggle between showing and hiding the password
        function togglePassword() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Change icon to 'Hidden' state
                toggleIcon.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                `;
            } else {
                passwordInput.type = 'password';
                // Change icon back to 'Visible' state
                toggleIcon.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                `;
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            loginBtn.innerText = "Authorizing...";
            loginBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            try {
                // Pointing to your Backend on Port 5000
                const response = await fetch('http://localhost:5000/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = "mt-6 text-center text-sm font-bold text-green-600";
                    messageDiv.innerText = "Success! Opening Control Room...";
                    
                    // Saving your Digital Badge (JWT)
                    localStorage.setItem('adminToken', data.token);
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    messageDiv.className = "mt-6 text-center text-sm font-bold text-red-600";
                    messageDiv.innerText = data.message || "Invalid Admin Credentials";
                    loginBtn.innerText = "Enter Dashboard";
                    loginBtn.disabled = false;
                }
            } catch (error) {
                messageDiv.className = "mt-6 text-center text-sm font-bold text-red-600";
                messageDiv.innerText = "Backend Offline. Check your terminal.";
                loginBtn.innerText = "Enter Dashboard";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
