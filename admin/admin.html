<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPart Pro | Admin Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass-sidebar { background: #0f172a; color: white; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <aside class="glass-sidebar w-full md:w-64 flex-shrink-0 p-6 md:sticky md:top-0 md:h-screen">
        <div class="flex items-center gap-3 mb-10">
            <div class="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-white">A</div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">Auto<span class="text-blue-500">Pro</span></h1>
        </div>
        
        <nav class="space-y-4">
            <a href="#" class="flex items-center gap-3 bg-blue-600/10 text-blue-400 p-3 rounded-xl font-bold text-sm">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 text-slate-400 hover:text-white p-3 rounded-xl font-bold text-sm transition">
                <i class="fas fa-box-open"></i> Inventory
            </a>
            <a href="#" class="flex items-center gap-3 text-slate-400 hover:text-white p-3 rounded-xl font-bold text-sm transition">
                <i class="fas fa-shopping-cart"></i> Orders
            </a>
            <button id="adminLogoutButton" class="flex items-center gap-3 text-red-400 p-3 rounded-xl font-bold text-sm mt-20">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>
    </aside>

    <main class="flex-grow p-4 md:p-10">
        <header class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Shop Overview</h2>
            <div class="flex items-center gap-4">
                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">Server Online</span>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
            <div class="stat-card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-blue-50 p-3 rounded-2xl text-blue-600"><i class="fas fa-cubes text-xl"></i></div>
                    <span id="totalParts" class="text-3xl font-black text-slate-900">0</span>
                </div>
                <p class="text-slate-500 font-bold text-xs uppercase tracking-widest">Total Parts Listed</p>
            </div>
            <div class="stat-card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-orange-50 p-3 rounded-2xl text-orange-600"><i class="fas fa-exclamation-triangle text-xl"></i></div>
                    <span id="lowStockCount" class="text-3xl font-black text-slate-900">0</span>
                </div>
                <p class="text-slate-500 font-bold text-xs uppercase tracking-widest">Low Stock Items</p>
            </div>
            <div class="stat-card bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-4">
                    <div class="bg-green-50 p-3 rounded-2xl text-green-600"><i class="fas fa-money-bill-wave text-xl"></i></div>
                    <span class="text-3xl font-black text-slate-900">₦<span id="totalRevenue">0</span></span>
                </div>
                <p class="text-slate-500 font-bold text-xs uppercase tracking-widest">Revenue (MTD)</p>
            </div>
        </div>

        <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200 mb-10">
            <div class="flex items-center gap-3 mb-6">
                <i class="fas fa-plus-circle text-blue-600"></i>
                <h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">List New Spare Part</h3>
            </div>
            <form id="uploadPartForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">Part Name</label>
                    <input type="text" id="partName" placeholder="e.g. Brake Pads" class="bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">OEM / Serial Number</label>
                    <input type="text" id="oemNumber" placeholder="e.g. 04465-33440" class="bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500 transition">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">Category</label>
                    <select id="category" class="bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500 transition">
                        <option value="Engine">Engine</option>
                        <option value="Brakes">Brakes</option>
                        <option value="Suspension">Suspension</option>
                        <option value="Electrical">Electrical</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">Price (₦)</label>
                    <input type="number" id="price" placeholder="55000" class="bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">Stock Quantity</label>
                    <input type="number" id="stockQuantity" placeholder="10" class="bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500 transition" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black uppercase text-slate-400 px-1">Part Image</label>
                    <input type="file" id="partImage" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs" required>
                </div>
                <div class="md:col-span-3 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
                        Publish to Marketplace
                    </button>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-8 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Recent Orders</h3>
                <button class="text-blue-600 font-bold text-xs uppercase">View All</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-[10px] font-black uppercase text-slate-400 tracking-widest">
                        <tr>
                            <th class="p-6">Part Details</th>
                            <th class="p-6">Customer</th>
                            <th class="p-6">Amount</th>
                            <th class="p-6">Status</th>
                            <th class="p-6">Action</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrdersTable" class="text-sm font-bold text-slate-600">
                        <tr><td colspan="5" class="p-10 text-center text-slate-400">Syncing orders with backend...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const API_BASE_URL = 'https://autopart-backend-yourname.onrender.com/api';

        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                window.location.href = 'admin-login.html';
                return;
            }

            // Logout Functionality
            document.getElementById('adminLogoutButton').addEventListener('click', () => {
                localStorage.removeItem('adminToken');
                window.location.href = 'admin-login.html';
            });

            // HANDLE PART UPLOAD
            document.getElementById('uploadPartForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData();
                formData.append('partName', document.getElementById('partName').value);
                formData.append('oemNumber', document.getElementById('oemNumber').value);
                formData.append('category', document.getElementById('category').value);
                formData.append('price', document.getElementById('price').value);
                formData.append('stockQuantity', document.getElementById('stockQuantity').value);
                formData.append('partImage', document.getElementById('partImage').files[0]);

                const submitBtn = e.target.querySelector('button');
                submitBtn.innerHTML = "Uploading...";
                submitBtn.disabled = true;

                try {
                    const response = await fetch(`${API_BASE_URL}/parts/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    
                    if (response.ok) {
                        alert("✅ Part listed successfully!");
                        location.reload();
                    } else {
                        const err = await response.json();
                        alert("❌ Upload Failed: " + err.message);
                    }
                } catch (error) {
                    alert("Critical connection error.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Publish to Marketplace";
                }
            });

            // LOAD STATS & ORDERS (To be implemented when backend routes are active)
            // fetchStats();
            // fetchOrders();
        });
    </script>
</body>
</html>
